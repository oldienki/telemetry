[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "light-telemetry"
version = "0.1.0"
description = "UDP fire-and-forget telemetry client for LightTelemetry"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
keywords = ["telemetry", "observability", "udp", "testing", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = ["msgpack>=1.0"]

[project.urls]
Repository = "https://github.com/oldienki/telemetry"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["light_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true
