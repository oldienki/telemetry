# Optional services for the e2e harness. The default run uses the memory
# engine and needs no services; bring this up to exercise the PostgreSQL
# backend end to end:
#
#   docker compose -f tests/e2e/docker-compose.yml up -d
#   TELEMETRY_E2E_DB_URL=postgres://telemetry:telemetry@127.0.0.1:5432/telemetry \
#       python3 tests/e2e/run_e2e.py --storage postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 2s
      timeout: 3s
      retries: 10
